.v9_6:
  image: kitware/vtk-for-ci:v9.6.1
  variables:
    VTK_VERSION: "9.6.1"
  rules:
    - if: $DISABLE_9_6 == "True"
      when: never
    - when: on_success

build-module-v9.6.1:
  extends:
    - .build-module
    - .v9_6

test-module-v9.6.1:
  extends:
    - .test-module
    - .v9_6
  dependencies:
    - build-module-v9.6.1
  needs:
    - build-module-v9.6.1
