.v9_5_win:
  image: 
    name: kitware/vtk-for-ci-win:v9.5.2
    entrypoint: ["powershell.exe"]
  variables:
    VTK_VERSION: "9.5.2"
  rules:
    - if: $DISABLE_9_5 == "True"
      when: never
    - when: on_success

build-module_win-v9.5.2:
  extends:
    - .build-module-win
    - .v9_5_win

test-module_win-v9.5.2:
  extends:
    - .test-module-win
    - .v9_5_win
  dependencies:
    - build-module_win-v9.5.2
  needs:
    - build-module_win-v9.5.2
