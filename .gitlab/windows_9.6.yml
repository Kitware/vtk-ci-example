.v9_6_win:
  image: 
    name: kitware/vtk-for-ci-win:v9.6.2
    entrypoint: ["powershell.exe"]
  variables:
    VTK_VERSION: "9.6.2"
  rules:
    - if: $DISABLE_9_6 == "True"
      when: never
    - when: on_success

build-module_win-v9.6.2:
  extends:
    - .build-module-win
    - .v9_6_win

test-module_win-v9.6.2:
  extends:
    - .test-module-win
    - .v9_6_win
  dependencies:
    - build-module_win-v9.6.2
  needs:
    - build-module_win-v9.6.2
